services:
  app:
    image: 'jc21/nginx-proxy-manager:2.15.1'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'   # Public HTTP
      - '443:443' # Public HTTPS
      - '127.0.0.1:81:81' # Admin Web UI (localhost only; use npm.<domain> or SSH tunnel)
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  # Shared network for all proxied apps. Created by this stack with a fixed
  # name; other stacks join it as `external: true`.
  proxy:
    name: proxy
